[colors]
background = #282828
foreground = #ebdbb2
red = #cc241d
green = #98971a
yellow = #d79921

[bar/fanto]

enable-ipc = true
; -> size
width = 1346px
height = 20
radius = 5.0
offset-x = 10
offset-y = 5
override-redirect = true

;-> bar colors
background = ${colors.background}
foreground = ${colors.yellow}

; -> lines
line-size = 3

; -> borders
border-size = 4
border-color = ${colors.background}

; -> padding
padding-left = 1
padding-right = 2

; -> modules
module-margin-left = 1
module-margin-right = 0
modules-left = i3
modules-right = xkeyboard pulseaudio cpu memory battery battery1 date time

; -> fonts
font-0 = Maple Mono NF:size=10

; -> cursor
cursor-click = pointer

;------------------
; I3 MODULE WINDOWS
;-------------------

[module/i3]
; -> basic info
type = internal/i3
format = <label-state><label-mode>
index-sort = true
wrapping-scroll = false

; -> style
label-mode-foreground = ${colors.foreground}
label-mode-background = ${colors.background}
label-mode-padding = 2

; -> names for the labels
ws-icon-0 = 1;I
ws-icon-1 = 2;II
ws-icon-2 = 3;III
ws-icon-3 = 4;IV
ws-icon-4 = 5;V
ws-icon-5 = 6;VI
ws-icon-6 = 7;VII
ws-icon-7 = 8;VIII
ws-icon-8 = 9;IX
ws-icon-9 = 10;X
ws-icon-default = X

; ->  Focused Workspace
label-focused = %icon%
label-focused-background = ${colors.background}
label-focused-foreground = ${colors.yellow}
label-focused-underline = ${colors.yellow}
label-focused-padding = 2

; -> Unfocused Workspace
label-unfocused = %icon%
label-unfocused-padding = 2

; ->  Visible but now using
label-visible = %icon%
label-visible-background = ${colors.background}
label-visible-padding = 2

; ->  Urgent Workspace
label-urgent = %icon%
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

;-------------
; DATE MODULE
;-------------

[module/date]
type= internal/date
interval = 1

; -> date
date = %d/%m/%Y
date-alt = "%d/%m/%Y"

; -> format
format-prefix-foreground = ${colors.foreground}
;label
label = [%date%]

[module/time]
type= internal/date
interval = 1

; -> time
time = %H:%M:%S
time-alt = %H:%M:%S

; -> format
format-prefix-foreground = ${colors.foreground}
;label
label = [%time%]

;-----------
; CPU MODULE
;-----------
[module/cpu]
type = internal/cpu
interval = 0.5
label = [CPU: %percentage%%]

;-------
; MEMORY
;-------
[module/memory]
type = internal/memory
interval = 1
label = [RAM: %mb_used%]

;--------------
; SOUND MODULE 
;--------------

[module/pulseaudio]
type = internal/pulseaudio
; format
format-volume = <label-volume>
;labels
label-volume = [VOL: %percentage%]
label-muted = [MUTED]

;---------------
; BATTERY MODULE
;---------------

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1

;labels
label-charging = [BAT0: %percentage%%]
label-discharging = [BAT0: %percentage%%]
label-full = [BAT0: %percentage%]

[module/battery1]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
time-format = %H:%M

;labels
label-charging = [BAT1: %percentage%%]
label-discharging = [BAT1: %percentage%%]
label-full = [BAT1: %percentage%]

[module/xkeyboard]
type = internal/xkeyboard
label-layout = [%layout%]

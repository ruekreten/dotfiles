[colors]
background = #282828
foreground = #ebdbb2
red = #cc241d
green = #98971a
yellow = #d79921

[bar/faggot]

enable-ipc = true
width = 100%
height = 20

background = ${colors.background}
foreground = ${colors.yellow}

line-size = 3

border-size = 4
border-bottom-size = 1
border-color = ${colors.background}

module-margin-left = 1
module-margin-right = 0
modules-left = i3
modules-right = xkeyboard pulseaudio temperature cpu memory battery battery1 date time

font-0 = Maple Mono NF:size=10

[module/temperature]
type = internal/temperature
interval = 1
thermal-zone = 1
label = [%temperature-c%]
label-warn = [%temperature-c%]

[module/i3]
type = internal/i3
format = <label-state><label-mode>
index-sort = true
wrapping-scroll = false

label-mode-foreground = ${colors.foreground}
label-mode-background = ${colors.background}
label-mode-padding = 2

ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10
ws-icon-default = X

label-focused = %icon%
label-focused-background = ${colors.background}
label-focused-foreground = ${colors.yellow}
label-focused-underline = ${colors.yellow}
label-focused-padding = 2

label-unfocused = %icon%
label-unfocused-padding = 2

label-visible = %icon%
label-visible-background = ${colors.background}
label-visible-padding = 2

label-urgent = %icon%
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

[module/date]
type= internal/date
interval = 1

date = %d/%m/%Y
date-alt = "%d/%m/%Y"

format-prefix-foreground = ${colors.foreground}
label = [%date%]

[module/time]
type= internal/date
interval = 1

time = %H:%M:%S
time-alt = %H:%M:%S

format-prefix-foreground = ${colors.foreground}
label = [%time%]

[module/cpu]
type = internal/cpu
interval = 0.5
label = [CPU: %percentage%%]

[module/memory]
type = internal/memory
interval = 1
label = [RAM: %mb_used%]

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = [VOL: %percentage%]
label-muted = [MUTED]

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1

label-charging = [BAT0: %percentage%%]
label-discharging = [BAT0: %percentage%%]
label-full = [BAT0: %percentage%]

[module/battery1]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
time-format = %H:%M

label-charging = [BAT1: %percentage%%]
label-discharging = [BAT1: %percentage%%]
label-full = [BAT1: %percentage%]

[module/xkeyboard]
type = internal/xkeyboard
label-layout = [%layout%]
